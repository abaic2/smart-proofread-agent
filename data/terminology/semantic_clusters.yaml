meta:
  name: 逻辑、风格与语义资源库
  version: "2026.09.1"

# ============ 逻辑严密性资源 ============
logic:
  # 绝对化断言：无证据支撑的强断言，逻辑上要求举证义务
  absolute_claims:
    - 必然
    - 毋庸置疑
    - 毫无疑问
    - 显而易见
    - 众所周知
    - 必然导致
    - 标志着
    - 证明了
    - 充分说明
    - 完全取决于
    - 唯一途径
    - 根本保证
  # 模糊限定：与强断言混用会造成逻辑强度不一致
  hedges:
    - 可能
    - 或许
    - 大致
    - 部分
    - 一定程度上
    - 有待进一步
  # 因果连接词，用于检测"因果跳步"
  causal_connectives: [因此, 因而, 所以, 由此可见, 导致, 致使, 从而, 说明, 表明, 这意味着]
  # 转折连接词
  contrast_connectives: [但是, 然而, 不过, 却, 相反, 反之]
  # 数量词与结论强度的匹配表
  quantity_claim_map:
    全部: { min_ratio: 1.0, advice: "“全部”要求覆盖率 100%，需给出全样本口径" }
    大多数: { min_ratio: 0.5, advice: "“大多数”建议给出具体占比（如 68.3%）" }
    部分: { min_ratio: 0.0, advice: "“部分”建议补充占比与样本量" }
    个别: { max_ratio: 0.05, advice: "“个别”通常指 5% 以下，请核对数据" }
    普遍: { min_ratio: 0.5, advice: "“普遍”需说明抽样范围与代表性" }
  # 指代不明触发词
  vague_reference: [该做法, 这一情况, 上述问题, 其, 此, 该, 这些, 那些, 相应地, 该举措]
  # 论证结构信号词
  argument_markers:
    claim: [本文认为, 研究表明, 可以判断, 结论是, 我们认为]
    evidence: [数据显示, 调查发现, 据统计, 样本, 案例, 实地调研]
    warrant: [基于, 根据, 依据, 按照, 参照]

# ============ 语文规范资源 ============
language:
  # 常见错别字 / 词语误用（正则 -> 建议）
  易错字:
    - { pattern: "按排", fix: "安排" }
    - { pattern: "布署", fix: "部署" }
    - { pattern: "决对", fix: "绝对" }
    - { pattern: "复盖", fix: "覆盖" }
    - { pattern: "成度", fix: "程度" }
    - { pattern: "不仅.*?而且", fix: "搭配正确，注意前后分句主语一致性", severity: INFO }
    - { pattern: "做为", fix: "作为" }
    - { pattern: "帐号", fix: "账号" }
    - { pattern: "截止到", fix: "截至" }
    - { pattern: "截止目前", fix: "截至目前" }
    - { pattern: "涉及到", fix: "涉及" }
    - { pattern: "每个群众都", fix: "每位群众都" }
    - { pattern: "进一步的加强", fix: "进一步加强" }
    - { pattern: "按装", fix: "安装" }
    - { pattern: "好象", fix: "好像" }
    - { pattern: "既使", fix: "即使" }
    - { pattern: "防碍", fix: "妨碍" }
    - { pattern: "精减", fix: "精简" }
    - { pattern: "重迭", fix: "重叠" }
    - { pattern: "默守", fix: "墨守" }
    - { pattern: "防犯", fix: "防范" }
    - { pattern: "引响", fix: "影响" }
  词语误用:
    - { pattern: "首当其冲地(受益|获得|承担)", fix: "首当其冲意为最先受到冲击，不可用作“首先”", severity: MAJOR }
    - { pattern: "(下降|降低|减少)了?(\\d+(\\.\\d+)?)\\s*倍", fix: "\\1了百分之 X（倍数不可用于减少，请换算为百分比）", severity: MAJOR }
    - { pattern: "近\\s*\\d+\\s*(余|多)?\\s*(人|家|个|项|亿|万)", fix: "“近”与“余/多”语义冲突，二者只能取一", severity: MINOR }
    - { pattern: "大约\\s*\\d+(\\.\\d+)?\\s*(余|多)", fix: "“大约”与“余/多”重复，保留其一", severity: MINOR }
    - { pattern: "(提高|增长|上升)至(\\d+)%", fix: "注意区分“增长了”与“增长到”", severity: MINOR }
    - { pattern: "(的|地|得)问题", fix: "结构助词使用需按语法功能判断", severity: INFO }
  标点:
    - { pattern: "[\\u4e00-\\u9fa5]{2,},\\s*[\\u4e00-\\u9fa5]", fix: "中文句内并列应使用顿号或全角逗号", severity: MINOR }
    # 直引号统一由 norm_engine 的 FMT-QUOTE 处理（仅对含中文内容的引号提示
    # 改用全角弯引号），此处不再用 ["'`] 通配，以免把英文/代码中的直引号误报。
    - { pattern: "。{2,}|！{2,}|！\\?", fix: "重复标点，规范文本不使用", severity: MINOR }
    - { pattern: "[\\(\\[][^)\\]]*[\\)\\]]", fix: "中文语境括号应为全角（）", severity: INFO, halfwidth_only: true }
  数据规范:
    - { pattern: "(同比|环比)增长\\s*\\d+(\\.\\d+)?\\s*%", fix: "同比/环比须标明基期口径", severity: MINOR }
    - { pattern: "\\d{4}\\s*年\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日", fix: "日期建议统一为“YYYY年M月D日”或“YYYY-MM-DD”", severity: INFO }
    - { pattern: "(提高了|增长了|上升到)\\s*至\\s*", fix: "“提高了”与“提高至”语义不同，请确认后删除冗余字", severity: MINOR }
  冗余表达:
    - { pattern: "截至目前为止", fix: "截至目前" }
    - { pattern: "亲自莅临", fix: "莅临" }
    - { pattern: "非常(重要|关键|必要)", fix: "改为“重要”“关键”“必要”，或前加程度量化说明", severity: INFO }
    - { pattern: "(进行|加以|予以)(了)?(探索|研究|分析|讨论)", fix: "尽量使用动词直陈式，如“研究了”“分析了”", severity: INFO }
    - { pattern: "(in order to|due to the fact that)", fix: "中文学术文本不建议夹杂英文短语", severity: MINOR }

# ============ 风格迁移资源 ============
style:
  presets:
    公文专报:
      description: 适用于向上级报送的调研专报，庄重、简练、结论前置
      rules:
        - 单句不超过 60 字，避免长定语堆叠
        - 每段首句为段旨句，采用"判断 + 依据"结构
        - 使用规范书面语，剔除口语、网络语、方言
        - 数据须标注来源与口径，结论须区分"现状—问题—建议"三段式
        - 标题采用"关于……的调研报告"或"……情况专报"
      do: [经调研, 建议, 拟, 现将有关情况报告如下, 存在的主要问题, 下一步工作建议]
      avoid: [我觉得, 说白了, 搞, 挺好的, 大概可能, 网上说, 据说]
    学术期刊:
      description: 适用于学术期刊论文，客观、可复现、论证链完整
      rules:
        - 使用第三人称被动或客观陈述，避免"我们认为"式主观色彩（除方法声明）
        - 结论须有数据或文献支撑，禁止主观断言
        - 术语首次出现须给出中英文全称与缩写
        - 图、表、公式须在正文中显式引用（"如图 1 所示"）
      do: [本文, 本研究表明, 已有研究, 实证检验, 显著性, 稳健性, 局限]
      avoid: [毫无疑问, 众所周知, 显然, 必然, 极大地, 非常好的]
    新闻通稿:
      description: 适用于对外发布的新闻通稿，客观、时效、可转述
      rules:
        - 导语不超过 100 字，交代五要素
        - 引用须注明发言人身份，不转述未核实内容
        - 慎用评价性形容词
      do: [据介绍, 记者了解到, 相关负责人表示, 截至目前]
      avoid: [据悉, 有关数据显示, 业内人士普遍认为]
  # 风格量化特征（用于打分）
  metrics:
    - { name: 平均句长, target: { 公文专报: [18, 45], 学术期刊: [22, 55], 新闻通稿: [15, 40] } }
    - { name: 口语词密度, target: { 公文专报: [0, 0.002], 学术期刊: [0, 0.001], 新闻通稿: [0, 0.005] } }
    - { name: 绝对化词密度, target: { 公文专报: [0, 0.002], 学术期刊: [0, 0.001], 新闻通稿: [0, 0.003] } }
    - { name: 数据标注率, target: { 公文专报: [0.8, 1.0], 学术期刊: [0.9, 1.0], 新闻通稿: [0.6, 1.0] } }
