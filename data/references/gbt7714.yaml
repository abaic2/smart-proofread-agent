meta:
  name: 参考文献与格式规范库
  version: "2026.09.1"
  standards:
    - GB/T 7714-2015《信息与文献 参考文献著录规则》
    - GB/T 15834-2011《标点符号用法》
    - 《学术出版规范 期刊学术不端行为界定》CY/T 174-2019
    - 《党政机关公文格式》GB/T 9704-2012

# 文献类型标识
doc_type_codes:
  M: 专著
  J: 期刊论文
  C: 论文集
  D: 学位论文
  R: 报告
  S: 标准
  P: 专利
  N: 报纸
  EB: 电子公告
  OL: 联机文献
  Z: 其他

# 各类型最小著录项（GB/T 7714-2015 顺序编码制）
required_fields:
  J: [作者, 题名, 刊名, 年, 卷期, 页码]
  M: [作者, 题名, 出版地, 出版者, 出版年]
  D: [作者, 题名, 保存地, 保存者, 年份]
  C: [作者, 题名, 编者, 文集名, 出版地, 出版者, 出版年, 页码]
  N: [作者, 题名, 报纸名, 出版日期, 版次]
  EB: [作者, 题名, 文献类型标志, 发布日期, 引用日期, 获取路径]

patterns:
  # 期刊：[1] 张三. 题名[J]. 刊名, 2023, 45(3): 12-20.
  J: '^\s*\[?\d+\]?\s*(?P<authors>.+?)\.\s*(?P<title>.+?)\[J\]\.\s*(?P<journal>.+?),\s*(?P<year>\d{4})(,\s*(?P<volume>\d+)(\((?P<issue>\d+)\))?)?\s*:\s*(?P<pages>[\d\-–]+)\s*\.?\s*$'
  # 专著：[2] 李四. 书名[M]. 北京: 人民出版社, 2021: 33-35.
  M: '^\s*\[?\d+\]?\s*(?P<authors>.+?)\.\s*(?P<title>.+?)\[M\]\.\s*(?P<place>.+?):\s*(?P<publisher>.+?),\s*(?P<year>\d{4})(\s*:\s*(?P<pages>[\d\-–]+))?\s*\.?\s*$'
  # 学位论文
  D: '^\s*\[?\d+\]?\s*(?P<authors>.+?)\.\s*(?P<title>.+?)\[D\]\.\s*(?P<place>.+?):\s*(?P<publisher>.+?),\s*(?P<year>\d{4})\s*\.?\s*$'
  # 报纸
  N: '^\s*\[?\d+\]?\s*(?P<authors>.+?)\.\s*(?P<title>.+?)\[N\]\.\s*(?P<journal>.+?),\s*(?P<year>\d{4})-(?P<month>\d{2})-(?P<day>\d{2})(\((?P<edition>.+?)\))?\s*\.?\s*$'
  # 电子资源
  EB: '^\s*\[?\d+\]?\s*(?P<authors>.+?)\.\s*(?P<title>.+?)\[EB/OL\]\.\s*(?P<url>https?://\S+)'
  # 含 DOI
  DOI: '(?i)doi\s*[:：]?\s*(10\.\d{4,9}/[-._;()/:A-Za-z0-9]+)'

checks:
  - id: REF-001
    name: 文献类型标识缺失或错误
    severity: MAJOR
    explain: 中文学术著录必须标注 [J]/[M]/[D]/[N]/[EB/OL] 等类型标识。
  - id: REF-002
    name: 页码格式不规范
    severity: MINOR
    explain: 页码范围应使用半字线 "-"，不混用 – — ～。
  - id: REF-003
    name: 作者数量与"等"使用
    severity: MINOR
    explain: 超过 3 名作者时，著录前 3 名后加", 等"（中文）或", et al."（西文）。
  - id: REF-004
    name: 年份疑似错误
    severity: MAJOR
    explain: 出版年份晚于当前年份，或早于 1900 年，属异常。
  - id: REF-005
    name: 引文与文末参考文献不对应
    severity: MAJOR
    explain: 正文出现 [n] 标注但文末无对应条目，或文末条目从未被引用。
  - id: REF-006
    name: 引用序号未按出现顺序编号
    severity: MINOR
    explain: 顺序编码制要求正文首次引用顺序与文末排列一致。
  - id: REF-007
    name: DOI 格式错误
    severity: MINOR
    explain: DOI 以 10. 开头，后接注册机构码与后缀。
  - id: REF-008
    name: 同一文献重复著录
    severity: MINOR
    explain: 题名与作者高度相似的两条文献可能为重复条目。

# 一级机构 / 常用刊名，用于疑似虚构来源的启发式判断
known_publishers:
  - 人民出版社
  - 中国社会科学出版社
  - 商务印书馆
  - 中华书局
  - 科学出版社
  - 高等教育出版社
  - 党建读物出版社
  - 中央文献出版社
  - 学习出版社
  - 社会科学文献出版社
known_journals:
  - 中国社会科学
  - 管理世界
  - 经济研究
  - 政治学研究
  - 社会学研究
  - 中国行政管理
  - 公共管理学报
  - 求是
  - 人民日报
  - 光明日报
  - 经济日报
  - 新华每日电讯
